<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Singhagiri Spin Wheel</title>
  <!-- Add your CSS styles or links here -->
</head>
<body>

  <!-- Paste your spin wheel UI (canvas, form inputs, spin button, etc.) here -->

  <script>
    async function submitSpinResult(name, email, prize) { 
      const response = await fetch('/api/save-spin', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ name, email, prize }) 
      }); 
      const result = await response.json(); 
      console.log(result); 
    }
  </script>
</body>
</html>
