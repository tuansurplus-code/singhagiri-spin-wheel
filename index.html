<!-- Inside public/index.html -->

<script>
  async function submitSpinResult(name, email, prize) { 
    const response = await fetch('/api/save-spin', { 
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' }, 
      body: JSON.stringify({ name, email, prize }) 
    }); 
    const result = await response.json(); 
    console.log(result); 
  }
</script>

</body>
</html>
